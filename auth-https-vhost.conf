<VirtualHost _default_:443>
  ServerName auth.cevolution.co.uk

  SSLEngine on
  SSLCertificateFile "/opt/bitnami/apache/conf/bitnami/certs/server.crt"
  SSLCertificateKeyFile "/opt/bitnami/apache/conf/bitnami/certs/server.key"
  SSLProxyCheckPeerExpire Off
  SSLProxyCheckPeerName Off
  SSLProxyCheckPeerCN Off
  SSLProxyEngine On
  ProxyRequests Off
  ProxyPreserveHost On

  ErrorLog logs/error_auth.log
  CustomLog logs/access_auth.log common

#  LogMessage "!!!--Server Name Match--!!!"

#  <If "%{REQUEST_METHOD} == 'OPTIONS'">
#    LogMessage ">>> OPTIONS Request Received for %{REQUEST_URI} <<< "
#  </If>

  # Block admin console and API for unauthorized IPs (return 404 to match Keycloak behavior)
  <LocationMatch "^/(admin|realms/master)">

    # IP whitelist for admin access
    <RequireAny>
      Require ip 51.136.31.9
      Require ip 20.4.5.153
      Require ip 10.0.0.4
      Require ip 10.0.2.4
    </RequireAny>
    
    # Return 404 instead of 403 for unauthorized attempts
    ErrorDocument 403 "<!DOCTYPE HTML PUBLIC \"-//IETF//DTD HTML 2.0//EN\"><html><head><title>404 Not Found</title></head><body><h1>Not Found</h1><p>The requested URL was not found on this server.</p></body></html>"
    
    ProxyPass https://localhost:8443/ nocanon
    ProxyPassReverse https://localhost:8443/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}e
    RequestHeader set X-Real-IP %{REMOTE_ADDR}e
  </LocationMatch>

  # Public resources - no IP restrictions
  <Location "/resources/">
    ProxyPass https://localhost:8443/resources/
    ProxyPassReverse https://localhost:8443/resources/
    RequestHeader set X-Forwarded-Proto "https"
  </Location>

  # Public realms (except master) - no IP restrictions
  # Note: /realms/master is already protected by LocationMatch above
  <Location "/realms/">
    ProxyPass https://localhost:8443/realms/
    ProxyPassReverse https://localhost:8443/realms/
    RequestHeader set X-Forwarded-Proto "https"
  </Location>

  # All other traffic (public endpoints) - default backend
  # Note: This should be last as it's the catch-all rule
  # Apache processes most-specific matches first, so Location blocks above take precedence
  ProxyPass / https://localhost:8080/
  ProxyPassReverse / https://localhost:8080/

#  Trying with access to OpenFGA via root path but may need to revert to support custom domain naming
#  ProxyPass / https://localhost:8443/realms/Cevolution/
#  ProxyPassReverse / https://localhost:8443/realms/Cevolution/

#  ProxyPass /admin https://localhost:8443/
#  ProxyPassReverse /admin https://localhost:8443/

</VirtualHost>
